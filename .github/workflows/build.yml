name: Build and cache WebKit

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'package.nix'
      - '*.patch'
      - 'source.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    concurrency:
      group: webkit-cache-${{ github.repository }}
      cancel-in-progress: false
    env:
      CACHIX_CACHE_NAME: luakit-hardened
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check cache configuration
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_CACHE_NAME"
          test -n "$CACHIX_AUTH_TOKEN"
      - name: Free space from unused runner SDKs
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel
            max-jobs = 1
            cores = 2
            extra-substituters = https://luakit-hardened.cachix.org
            extra-trusted-public-keys = luakit-hardened.cachix.org-1:x3DEaKNb//17n1vH+96ucQ7U9k6e5IuDogF22zZKEPI=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: luakit-hardened
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push only the successful runtime/dev closure, not sources/debug files.
          skipPush: true
          skipAddingSubstituter: true
      - name: Check without compiling WebKit
        run: nix flake check --no-build
      - name: Build runtime and development outputs
        run: nix build .#cache --out-link result --print-build-logs
      - name: Upload and retain three successful builds
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cache_root=$(readlink -f result)
          cachix push "$CACHIX_CACHE_NAME" "$cache_root"
          pin=webkitgtk-4.1-libwebrtc-x86_64-linux
          pins=$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $CACHIX_AUTH_TOKEN" \
            "https://app.cachix.org/api/v1/cache/$CACHIX_CACHE_NAME/pin")
          jq -e 'type == "array"' <<< "$pins" > /dev/null
          if jq -e --arg pin "$pin" --arg root "$cache_root" \
            'any(.[]; .name == $pin and .lastRevision.storePath == $root and .lastRevision.orphaned == false)' \
            <<< "$pins" > /dev/null; then
            echo 'This output is already the current cache pin.'
          else
            cachix pin "$CACHIX_CACHE_NAME" "$pin" "$cache_root" --keep-revisions 3
          fi
