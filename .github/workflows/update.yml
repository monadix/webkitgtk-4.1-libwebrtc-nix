name: Update WebKit

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-webkit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Pin the latest development commit
        run: nix develop --command bash scripts/update.sh
      - name: Check without compiling WebKit
        run: nix flake check --no-build
      - name: Commit the new pin
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- source.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json
          git commit -m "chore: update WebKit to $(jq -r .rev source.json)"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN pushes do not trigger another push workflow.
  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.update.outputs.ref }}
    secrets: inherit
