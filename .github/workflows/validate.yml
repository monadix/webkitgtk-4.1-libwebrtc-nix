name: Validate patched WebKit and cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    outputs:
      cache-root: ${{ steps.paths.outputs.cache-root }}
      test-runner: ${{ steps.paths.outputs.test-runner }}
      artifact-name: ${{ steps.paths.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Free space from unused runner SDKs
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel
            max-jobs = 1
            cores = 2
            extra-substituters = https://luakit-hardened.cachix.org
            extra-trusted-public-keys = luakit-hardened.cachix.org-1:x3DEaKNb//17n1vH+96ucQ7U9k6e5IuDogF22zZKEPI=
      - name: Check and build the pinned fork with API tests
        run: |
          nix flake check --no-build
          nix build .#validation-cache .#validation-run-tests --no-link --print-build-logs
      - name: Export compiled closure for the test job
        id: paths
        run: |
          cache_root=$(nix path-info .#validation-cache)
          test_runner=$(nix path-info .#validation-run-tests)
          {
            echo "artifact-name=validation-closure-${{ github.run_attempt }}"
            echo "cache-root=$cache_root"
            echo "test-runner=$test_runner"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/validation-transfer"
          nix copy --to "file://$RUNNER_TEMP/validation-transfer?compression=zstd" "$cache_root" "$test_runner"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.paths.outputs.artifact-name }}
          path: ${{ runner.temp }}/validation-transfer
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test-and-cache:
    needs: build
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      CACHIX_CACHE_NAME: luakit-hardened
      CACHE_ROOT: ${{ needs.build.outputs.cache-root }}
      TEST_RUNNER: ${{ needs.build.outputs.test-runner }}
    steps:
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://luakit-hardened.cachix.org
            extra-trusted-public-keys = luakit-hardened.cachix.org-1:x3DEaKNb//17n1vH+96ucQ7U9k6e5IuDogF22zZKEPI=
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/validation-transfer
      - name: Import the build job's closure
        run: |
          # This unsigned local binary cache is an artifact from this workflow.
          nix copy --from "file://$RUNNER_TEMP/validation-transfer" --no-check-sigs "$CACHE_ROOT" "$TEST_RUNNER"
      - name: Run regression and related GLib API tests
        run: '"$TEST_RUNNER/bin/webkit-validation-tests"'
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-logs-${{ github.run_attempt }}
          path: validation-logs
          retention-days: 14
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: luakit-hardened
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          skipAddingSubstituter: true
      - name: Upload validated runtime and headers, retain three versions
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          cachix push "$CACHIX_CACHE_NAME" "$CACHE_ROOT"
          pin=webkitgtk-4.1-libwebrtc-validation-x86_64-linux
          pins=$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $CACHIX_AUTH_TOKEN" \
            "https://app.cachix.org/api/v1/cache/$CACHIX_CACHE_NAME/pin")
          jq -e 'type == "array"' <<< "$pins" > /dev/null
          if jq -e --arg pin "$pin" --arg root "$CACHE_ROOT" \
            'any(.[]; .name == $pin and .lastRevision.storePath == $root and .lastRevision.orphaned == false)' \
            <<< "$pins" > /dev/null; then
            echo 'This output is already the current validation pin.'
          else
            cachix pin "$CACHIX_CACHE_NAME" "$pin" "$CACHE_ROOT" --keep-revisions 3
          fi
